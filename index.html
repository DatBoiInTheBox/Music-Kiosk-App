<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kiosk Music</title>
<style>
:root{--bg:#0e0f14;--card:#181a22;--card2:#232632;--tx:#f2f3f7;--mut:#8b8fa3;--acc:#1ed760;--acc2:#18b850}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html{font-size:calc(100vw/54);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:1rem;cursor:pointer}
button:active{transform:scale(.96);filter:brightness(1.3)}
header{display:flex;gap:1rem;padding:1.5rem 2rem 1rem}
.tab{flex:1;padding:1.3rem;font-size:1.7rem;font-weight:700}
.tab.on{background:var(--acc);color:#04210f}
.src{display:flex;gap:.8rem;padding:0 2rem 1rem}
.src button{flex:1;padding:.9rem;font-size:1.3rem;background:var(--card)}
.src button.on{outline:.15rem solid var(--acc);color:var(--acc)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#q{margin:0 2rem 1rem;padding:1.3rem 1.6rem;font-size:2rem;background:var(--card);border-radius:1rem;min-height:4.6rem;display:flex;align-items:center}
#q span.ph{color:var(--mut)}
#q i{display:inline-block;width:.15rem;height:2.2rem;background:var(--acc);margin-left:.2rem;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.list{flex:1;overflow-y:auto;padding:0 2rem;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:1.3rem;background:var(--card);border-radius:1.2rem;padding:1rem;margin-bottom:.9rem}
.row.cur{outline:.15rem solid var(--acc)}
.row img{width:6.4rem;height:6.4rem;border-radius:.8rem;object-fit:cover;background:var(--card2);flex:none}
.meta{flex:1;min-width:0}
.t{font-size:1.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:1.5rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3rem}
.row button{width:5.6rem;height:5.6rem;font-size:2.4rem;flex:none}
.row .add.done{background:var(--acc);color:#04210f}
.msg{text-align:center;color:var(--mut);font-size:1.8rem;padding:3rem}
#kb{background:var(--card);padding:1rem 1rem 1.2rem;border-radius:1.5rem 1.5rem 0 0}
#kb .r{display:flex;gap:.6rem;margin-bottom:.6rem;justify-content:center}
#kb button{flex:1;height:5.2rem;font-size:2.1rem;border-radius:.8rem;padding:0}
#kb .w2{flex:1.6}#kb .sp{flex:5}#kb .go{flex:2.2;background:var(--acc);color:#04210f;font-weight:700}
#kbtoggle{margin:0 2rem .8rem;padding:.8rem;font-size:1.4rem;background:var(--card)}
.bar{display:flex;gap:1rem;padding:1rem 2rem;align-items:center}
.bar button{padding:1rem 1.6rem;font-size:1.5rem}
.bar .sp{flex:1;font-size:1.5rem;color:var(--mut)}
#player{background:var(--card);padding:1.4rem 2rem 1.8rem;border-top:.1rem solid #2a2d3a}
.np{display:flex;gap:1.3rem;align-items:center}
.np img{width:8rem;height:8rem;border-radius:1rem;background:var(--card2);object-fit:cover}
.np .t{font-size:2.1rem}
.seek{display:flex;align-items:center;gap:1rem;margin:1rem 0 .8rem;font-size:1.3rem;color:var(--mut)}
#sb{flex:1;height:2.6rem;display:flex;align-items:center}
#sb div{width:100%;height:.8rem;background:var(--card2);border-radius:1rem;overflow:hidden}
#sf{height:100%;width:0;background:var(--acc)}
.ctl{display:flex;gap:1rem;justify-content:center}
.ctl button{width:8rem;height:6.6rem;font-size:2.6rem}
.ctl #pp{width:11rem;background:var(--acc);color:#04210f}
.ctl button.on{color:var(--acc)}
#toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:#000c;padding:1.4rem 2.4rem;border-radius:1.2rem;font-size:1.8rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="tab on" data-v="search">🔍 Search</button>
  <button class="tab" data-v="list">🎵 Playlist <span id="cnt"></span></button>
</header>
<div class="src" id="src">
  <button data-s="audius" class="on">Full songs (Audius)</button>
  <button data-s="itunes">Popular hits (30s preview)</button>
</div>
<main>
  <section class="view on" id="v-search">
    <div id="q"></div>
    <div class="list" id="res"><div class="msg">Type a song or artist, then tap Search</div></div>
    <button id="kbtoggle">⌨ Hide keyboard</button>
    <div id="kb"></div>
  </section>
  <section class="view" id="v-list">
    <div class="bar"><div class="sp" id="lt"></div><button id="clr">🗑 Clear all</button></div>
    <div class="list" id="pl"></div>
  </section>
</main>
<div id="player">
  <div class="np"><img id="art" alt=""><div class="meta"><div class="t" id="nt">Nothing playing</div><div class="a" id="na">Search and add songs</div></div></div>
  <div class="seek"><span id="tc">0:00</span><div id="sb"><div><div id="sf"></div></div></div><span id="td">0:00</span></div>
  <div class="ctl"><button id="shuf">🔀</button><button id="prev">⏮</button><button id="pp">▶</button><button id="next">⏭</button><button id="rep">🔁</button></div>
</div>
<div id="toast"></div>
<audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s), au=$('#au');
let source='audius', query='', results=[], queue=[], idx=-1, shuffle=false, repeat=0, host=null;
try{queue=JSON.parse(localStorage.getItem('kq')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('kq',JSON.stringify(queue))}catch(e){}};
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1100)}

// kiosk lockdown
document.addEventListener('contextmenu',e=>e.preventDefault());

// tabs
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  $('#src').style.display=b.dataset.v==='search'?'flex':'none';
  if(b.dataset.v==='list')renderList();
});
document.querySelectorAll('#src button').forEach(b=>b.onclick=()=>{
  source=b.dataset.s;document.querySelectorAll('#src button').forEach(x=>x.classList.toggle('on',x===b));
  if(query)search();
});

// on-screen keyboard
const rows=['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'];
const kb=$('#kb');
rows.forEach((r,i)=>{
  const d=document.createElement('div');d.className='r';
  [...r].forEach(c=>d.insertAdjacentHTML('beforeend',`<button data-k="${c}">${c}</button>`));
  if(i===3)d.insertAdjacentHTML('beforeend','<button data-k="BS" class="w2">⌫</button>');
  kb.appendChild(d);
});
kb.insertAdjacentHTML('beforeend','<div class="r"><button data-k="-">-</button><button data-k="\'">\'</button><button data-k=" " class="sp">space</button><button data-k="GO" class="go">Search</button></div>');
kb.onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(k==null)return;
  if(k==='BS')query=query.slice(0,-1);else if(k==='GO'){search();return}else query+=k;drawQ()};
$('#kbtoggle').onclick=()=>{const h=kb.style.display==='none';kb.style.display=h?'':'none';$('#kbtoggle').textContent=h?'⌨ Hide keyboard':'⌨ Show keyboard'};
function drawQ(){$('#q').innerHTML=(query?esc(query):'<span class="ph">Search songs or artists</span>')+'<i></i>'}
drawQ();

// search
function jsonp(url){return new Promise((res,rej)=>{const n='cb'+Date.now(),s=document.createElement('script');
  window[n]=d=>{res(d);s.remove();delete window[n]};s.onerror=rej;s.src=url+'&callback='+n;document.head.appendChild(s)})}
async function getHost(){
  if(host)return host;
  const d=await (await fetch('https://api.audius.co')).json();
  host=d.data[Math.floor(Math.random()*d.data.length)];return host;
}
async function search(){
  if(!query.trim())return;
  const box=$('#res');box.innerHTML='<div class="msg">Searching…</div>';
  try{
    if(source==='audius'){
      const h=await getHost();
      const d=await (await fetch(`${h}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=25&app_name=KIOSKMUSIC`)).json();
      results=(d.data||[]).map(t=>({id:'a'+t.id,src:'audius',aid:t.id,title:t.title,artist:t.user?.name||'',art:t.artwork?.['480x480']||t.artwork?.['150x150']||'',dur:t.duration}));
    }else{
      const u=`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=25`;
      let d;try{d=await (await fetch(u)).json()}catch(e){d=await jsonp(u)}
      results=(d.results||[]).filter(t=>t.previewUrl).map(t=>({id:'i'+t.trackId,src:'itunes',url:t.previewUrl,title:t.trackName,artist:t.artistName,art:(t.artworkUrl100||'').replace('100x100','600x600'),dur:30}));
    }
    drawRes();
    if(results.length)kb.style.display='none',$('#kbtoggle').textContent='⌨ Show keyboard';
  }catch(e){host=null;box.innerHTML='<div class="msg">Could not reach the music service.<br>Check the internet connection and try again.</div>'}
}
function rowHTML(t,i,mode){
  const inQ=queue.some(q=>q.id===t.id);
  const btns=mode==='res'?`<button data-a="play" data-i="${i}">▶</button><button class="add ${inQ?'done':''}" data-a="add" data-i="${i}">${inQ?'✓':'＋'}</button>`
    :`<button data-a="del" data-i="${i}">✕</button>`;
  return `<div class="row ${mode==='q'&&i===idx?'cur':''}" data-a="${mode==='q'?'jump':'none'}" data-i="${i}"><img src="${esc(t.art)}" alt=""><div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>${btns}</div>`;
}
function drawRes(){$('#res').innerHTML=results.length?results.map((t,i)=>rowHTML(t,i,'res')).join(''):'<div class="msg">No results. Try another search or source.</div>'}
$('#res').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=results[+b.dataset.i];
  if(b.dataset.a==='add'){if(!queue.some(q=>q.id===t.id)){queue.push(t);save();toast('Added to playlist');if(idx<0)load(0,false);drawRes();count()}}
  if(b.dataset.a==='play'){let k=queue.findIndex(q=>q.id===t.id);if(k<0){queue.push(t);save();k=queue.length-1;count();drawRes()}load(k,true);toast('Playing')}};

// playlist
function count(){$('#cnt').textContent=queue.length?`(${queue.length})`:''}
function renderList(){
  $('#lt').textContent=queue.length?`${queue.length} song${queue.length>1?'s':''} in playlist`:'';
  $('#pl').innerHTML=queue.length?queue.map((t,i)=>rowHTML(t,i,'q')).join(''):'<div class="msg">Your playlist is empty.<br>Search for songs and tap ＋</div>';
}
$('#pl').onclick=e=>{const el=e.target.closest('[data-a]');if(!el)return;const i=+el.dataset.i;
  if(el.dataset.a==='del'){queue.splice(i,1);if(i<idx)idx--;else if(i===idx){if(queue.length){load(Math.min(i,queue.length-1),!au.paused)}else{au.pause();au.removeAttribute('src');idx=-1;info()}}save();count();renderList()}
  else if(el.dataset.a==='jump'){load(i,true);renderList()}};
$('#clr').onclick=()=>{if(!queue.length)return;if(!confirm('Clear the whole playlist?'))return;queue=[];idx=-1;au.pause();au.removeAttribute('src');save();count();renderList();info()};

// player
async function srcUrl(t){if(t.src==='itunes')return t.url;const h=await getHost();return `${h}/v1/tracks/${t.aid}/stream?app_name=KIOSKMUSIC`}
async function load(i,play){
  if(i<0||i>=queue.length)return;idx=i;const t=queue[i];info();
  try{au.src=await srcUrl(t);if(play)await au.play()}catch(e){if(play)setTimeout(()=>step(1,true),600)}
  if($('#v-list').classList.contains('on'))renderList();
}
function info(){const t=queue[idx];$('#nt').textContent=t?t.title:'Nothing playing';$('#na').textContent=t?t.artist:'Search and add songs';
  const a=$('#art');if(t&&t.art){a.src=t.art;a.style.visibility='visible'}else a.style.visibility='hidden'}
function step(d,auto){
  if(!queue.length)return;let n;
  if(shuffle&&queue.length>1){do{n=Math.floor(Math.random()*queue.length)}while(n===idx)}
  else{n=idx+d;if(n>=queue.length){if(repeat===1||!auto)n=0;else{au.pause();return}}if(n<0)n=queue.length-1}
  load(n,true);
}
$('#pp').onclick=()=>{if(idx<0&&queue.length)return load(0,true);au.paused?au.play():au.pause()};
$('#next').onclick=()=>step(1,false);
$('#prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1,false)};
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle);toast(shuffle?'Shuffle on':'Shuffle off')};
$('#rep').onclick=e=>{repeat=(repeat+1)%3;e.currentTarget.classList.toggle('on',repeat>0);e.currentTarget.textContent=repeat===2?'🔂':'🔁';toast(['Repeat off','Repeat playlist','Repeat song'][repeat])};
au.onplay=()=>$('#pp').textContent='⏸';au.onpause=()=>$('#pp').textContent='▶';
au.onended=()=>{if(repeat===2){au.currentTime=0;au.play()}else step(1,true)};
au.onerror=()=>{if(au.src)setTimeout(()=>step(1,true),800)};
au.ontimeupdate=()=>{const d=au.duration||0;$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(d);$('#sf').style.width=d?(au.currentTime/d*100)+'%':'0'};
$('#sb').addEventListener('pointerdown',e=>{const r=$('#sb').getBoundingClientRect();if(au.duration)au.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*au.duration});

count();if(queue.length)load(0,false);
</script>
</body>
</html>
